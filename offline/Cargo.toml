[package]
name = "wisperflow-offline"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
cpal = "0.18.2"
whisper-rs = "0.16.0"
x11rb = "0.14.0"

[features]
default = ["vulkan"]
# GPU transcription (Intel/AMD/NVIDIA via Vulkan). Build CPU-only with --no-default-features.
vulkan = ["whisper-rs/vulkan"]
